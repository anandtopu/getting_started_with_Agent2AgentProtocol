name: Course validation
on: [push, pull_request]
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --offline ruff check .
      - run: uv run --offline ruff format --check .
      - run: uv run --offline pytest
      - run: uv run --offline python scripts/validate_gym.py
      - run: uv run --offline python scripts/check_links.py
      - run: uv run --offline python scripts/run_all_examples.py --notebooks
  local-interop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: npm run typecheck
      - run: uv run --offline python scripts/check_typescript_interop.py
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: modules/bonus/B2_other_sdks/go/go.sum
      - run: uv run --offline python scripts/check_go_interop.py
      - run: uv run --offline python scripts/check_network.py --module 0
      - run: uv run --offline python scripts/check_network.py --module 5
      - run: uv run --offline python scripts/check_network.py --module 8
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python deploy/prepare.py
      - run: docker compose --env-file deploy/secrets/network.env -f deploy/docker-compose.yml up --build -d
      - run: uv run python scripts/check_compose.py
      - if: failure()
        run: docker compose --env-file deploy/secrets/network.env -f deploy/docker-compose.yml logs --tail 80
      - if: always()
        run: docker compose --env-file deploy/secrets/network.env -f deploy/docker-compose.yml down --volumes
