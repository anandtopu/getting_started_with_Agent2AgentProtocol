name: Course validation
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frameworks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [adk, strands, pydantic, crewai, microsoft, beeai]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python scripts/setup_frameworks.py --framework ${{ matrix.framework }}
      - run: uv run python scripts/check_frameworks.py --framework ${{ matrix.framework }}
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --offline ruff check .
      - run: uv run --offline ruff format --check .
      - run: uv run --offline pytest
      - run: uv run --offline python scripts/validate_gym.py
      - run: uv run --offline python scripts/check_links.py
      - run: uv run --offline python scripts/run_all_examples.py --notebooks
  local-interop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: npm run typecheck
      - run: uv run --offline python scripts/check_typescript_interop.py
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: modules/bonus/B2_other_sdks/go/go.sum
      - run: uv run --offline python scripts/check_go_interop.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: uv run --offline python scripts/check_java_interop.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: uv run --offline python scripts/check_dotnet_interop.py
      - run: uv run --offline python scripts/check_network.py --module 0
      - run: uv run --offline python scripts/check_network.py --module 5
      - run: uv run --offline python scripts/check_network.py --module 8
      - run: uv run --offline python scripts/check_tls.py
      - run: uv run --offline python scripts/check_webhook_lab.py
  tck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python scripts/check_tck.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-tck-evidence
          path: |
            workspace/a2a-tck/reports/
            workspace/tck-summary.json
            workspace/tck-results.log
  postgres-cluster:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: maplewood
          POSTGRES_PASSWORD: isolated-ci-fixture
          POSTGRES_DB: maplewood
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MAPLEWOOD_TEST_DATABASE: postgresql+asyncpg://maplewood:isolated-ci-fixture@localhost:5432/maplewood
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra production
      - run: uv run pytest -o addopts= tests/test_cluster.py
  live-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: ollama
      LLM_MODEL: qwen3:4b
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Install pinned Ollama and run the free model
        shell: bash
        run: |
          mkdir -p workspace/ollama
          curl --fail --location https://github.com/ollama/ollama/releases/download/v0.40.15/ollama-linux-amd64.tar.zst -o workspace/ollama.tar.zst
          curl --fail --location https://github.com/ollama/ollama/releases/download/v0.40.15/sha256sum.txt -o workspace/sha256sum.txt
          cd workspace
          grep 'ollama-linux-amd64.tar.zst' sha256sum.txt | sed 's|ollama-linux-amd64.tar.zst|ollama.tar.zst|' | sha256sum --check
          tar --zstd -xf ollama.tar.zst -C ollama
          cd ..
          workspace/ollama/bin/ollama serve > workspace/ollama.log 2>&1 &
          OLLAMA_PID=$!
          trap 'kill "$OLLAMA_PID"' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/version && break; sleep 1; done
          workspace/ollama/bin/ollama pull "$LLM_MODEL"
          uv run python scripts/check_live_model.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-ollama-evidence
          path: |
            workspace/live-model.json
            workspace/ollama.log
  hardened-frameworks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra production
      - run: uv run python deploy/prepare.py
      - run: uv run python deploy/certificates.py
      - run: docker compose --env-file deploy/secrets/network.env -f deploy/docker-compose.yml -f deploy/hardened.yml -f deploy/frameworks.yml up --build -d
      - run: uv run python scripts/check_hardened.py
        env:
          CHECK_FRAMEWORKS: "1"
      - if: failure()
        run: docker compose --env-file deploy/secrets/network.env -f deploy/docker-compose.yml -f deploy/hardened.yml -f deploy/frameworks.yml logs --tail 100
      - if: always()
        run: docker compose --env-file deploy/secrets/network.env -f deploy/docker-compose.yml -f deploy/hardened.yml -f deploy/frameworks.yml down --volumes
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python deploy/prepare.py
      - run: docker compose --env-file deploy/secrets/network.env -f deploy/docker-compose.yml up --build -d
      - run: uv run python scripts/check_compose.py
      - run: uv run python scripts/check_keycloak.py
      - if: failure()
        run: docker compose --env-file deploy/secrets/network.env -f deploy/docker-compose.yml logs --tail 80
      - if: always()
        run: docker compose --env-file deploy/secrets/network.env -f deploy/docker-compose.yml down --volumes
