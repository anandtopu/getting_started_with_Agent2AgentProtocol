        "run",
        "--no-sync",
        "maplewood",
        "--vendor",
        "print",
        "--host",
        "0.0.0.0"
      ],
      "environment": {
        "MAPLEWOOD_TOKEN": "${PRINT_TOKEN:?Run deploy/prepare.py}",
        "MAPLEWOOD_VENDOR_URLS": "{\"venues\":\"http://venues:8100\",\"catering\":\"http://catering:8101\",\"av\":\"http://av:8102\",\"travel\":\"http://travel:8103\",\"print\":\"http://print:8104\"}",
        "MAPLEWOOD_SIGNING_KEY": "${PRINT_SIGNING_KEY:?Run deploy/prepare.py}",
