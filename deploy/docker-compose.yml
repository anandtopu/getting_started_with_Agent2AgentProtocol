        }
      }
    },
    "concierge": {
      "build": {
        "context": "..",
        "dockerfile": "deploy/Dockerfile"
      },
      "command": [
        "uv",
        "run",
        "--no-sync",
        "maplewood",
        "--vendor",
        "concierge",
        "--host",
        "0.0.0.0"
      ],
      "environment": {
        "MAPLEWOOD_TOKEN": "${CONCIERGE_TOKEN:?Run deploy/prepare.py}",
        "MAPLEWOOD_VENDOR_URLS": "{\"venues\":\"http://venues:8100\",\"catering\":\"http://catering:8101\",\"av\":\"http://av:8102\",\"travel\":\"http://travel:8103\",\"print\":\"http://print:8104\"}",
        "MAPLEWOOD_VENDOR_TOKENS": "${VENDOR_TOKENS:?Run deploy/prepare.py}",
        "MAPLEWOOD_SIGNING_KEY": "${CONCIERGE_SIGNING_KEY:?Run deploy/prepare.py}",
        "MAPLEWOOD_TRUSTED_KEYS": "${TRUSTED_KEYS:?Run deploy/prepare.py}",
        "MAPLEWOOD_GRPC_TARGET": "print:8204",
        "DATABASE_URL": "postgresql+asyncpg://maplewood:${POSTGRES_PASSWORD}@postgres:5432/maplewood",
        "OTEL_EXPORTER_OTLP_ENDPOINT": "http://jaeger:4318",
        "OTEL_SERVICE_NAME": "maplewood-concierge"
      },
      "ports": [
        "127.0.0.1:8105:8105"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "jaeger": {
          "condition": "service_started"
        }
      }
    },
    "postgres": {
      "image": "postgres:17",
      "environment": {
        "POSTGRES_USER": "maplewood",
        "POSTGRES_DB": "maplewood",
        "POSTGRES_PASSWORD": "${POSTGRES_PASSWORD:?Run deploy/prepare.py}"
      },
      "volumes": [
        "postgres_data:/var/lib/postgresql/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U maplewood -d maplewood"
        ],
        "interval": "2s",
        "timeout": "3s",
        "retries": 30
      }
    },
    "keycloak": {
      "image": "quay.io/keycloak/keycloak:26.8.2",
      "command": [
        "start-dev",
        "--import-realm"
      ],
      "environment": {
        "KC_BOOTSTRAP_ADMIN_USERNAME": "admin",
        "KC_HOSTNAME": "http://127.0.0.1:8080",
        "MAPLEWOOD_OIDC_SECRET": "${OIDC_CLIENT_SECRET:?Run deploy/prepare.py}",
        "KC_BOOTSTRAP_ADMIN_PASSWORD": "${KEYCLOAK_PASSWORD:?Run deploy/prepare.py}"
      },
      "volumes": ["./secrets/maplewood-realm.json:/opt/keycloak/data/import/maplewood-realm.json:ro"],
      "ports": [
        "127.0.0.1:8080:8080"
      ]
    },
    "oidc-venue": {
      "build": {"context": "..", "dockerfile": "deploy/Dockerfile"},
      "command": ["uv", "run", "--no-sync", "python", "-m", "agents.oidc_server", "--host", "0.0.0.0"],
      "environment": {
        "OIDC_ISSUER": "http://127.0.0.1:8080/realms/maplewood",
        "OIDC_JWKS_URL": "http://keycloak:8080/realms/maplewood/protocol/openid-connect/certs"
      },
      "ports": ["127.0.0.1:8106:8106"],
      "depends_on": ["keycloak"]
    },
    "jaeger": {
      "image": "jaegertracing/jaeger:2.23.0",
      "ports": [
        "127.0.0.1:16686:16686"
      ]
    }
  },
  "volumes": {
    "postgres_data": {}
  }
}
