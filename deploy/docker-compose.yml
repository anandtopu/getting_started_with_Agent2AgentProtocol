{
  "services": {
    "venues": {
      "build": {
        "context": "..",
        "dockerfile": "deploy/Dockerfile"
      },
      "command": [
        "uv",
        "run",
        "--no-sync",
        "maplewood",
        "--vendor",
        "venues",
        "--host",
        "0.0.0.0"
      ],
      "environment": {
        "MAPLEWOOD_TOKEN": "${VENUES_TOKEN:?Run deploy/prepare.py}",
        "MAPLEWOOD_VENDOR_URLS": "{\"venues\":\"http://venues:8100\",\"catering\":\"http://catering:8101\",\"av\":\"http://av:8102\",\"travel\":\"http://travel:8103\",\"print\":\"http://print:8104\"}",
        "MAPLEWOOD_SIGNING_KEY": "${VENUES_SIGNING_KEY:?Run deploy/prepare.py}",
        "MAPLEWOOD_TRUSTED_KEYS": "${TRUSTED_KEYS:?Run deploy/prepare.py}",
        "MAPLEWOOD_GRPC_TARGET": "print:8204",
        "DATABASE_URL": "postgresql+asyncpg://maplewood:${POSTGRES_PASSWORD}@postgres:5432/maplewood",
        "OTEL_EXPORTER_OTLP_ENDPOINT": "http://jaeger:4318",
        "OTEL_SERVICE_NAME": "maplewood-venues"
      },
      "ports": [
        "127.0.0.1:8100:8100"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "jaeger": {
          "condition": "service_started"
        }
      }
    },
    "catering": {
      "build": {
        "context": "..",
        "dockerfile": "deploy/Dockerfile"
