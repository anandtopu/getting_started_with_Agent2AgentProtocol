{
  "services": {
    "venues": {
      "build": {
        "args": {
          "FRAMEWORK": "adk"
        }
      },
      "command": [
        "uv",
        "run",
        "--no-sync",
        "maplewood",
        "--vendor",
        "venues",
        "--host",
        "0.0.0.0",
        "--framework",
        "adk"
      ],
      "environment": {
        "MAPLEWOOD_VENDOR_TIMEOUT": "90"
      }
    },
    "catering": {
