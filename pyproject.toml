[build-system]
requires = ["hatchling>=1.33.0,<2"]
build-backend = "hatchling.build"

[project]
name = "maplewood-a2a-course"
version = "0.1.0"
description = "Learn A2A 1.0.1 by building the Maplewood Events vendor network"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "a2a-sdk[http-server,grpc,signing,sqlite,telemetry]>=1.3.0,<1.4",
  "fastapi>=0.162.2,<0.163",
  "uvicorn>=0.54.0,<0.55",
  "httpx>=0.28.1,<0.29",
  "rich>=15.0.0,<16",
  "typer>=0.28.0,<0.29",
  "pydantic-settings>=2.16.2,<3",
  "jsonschema>=4.26.0,<5",
  "jcs>=0.3.0,<0.4",
  "cryptography>=50.0.2,<51",
  "PyJWT>=2.15.1,<3",
  "streamlit>=1.67.0,<1.68",
  "nbformat>=5.11.1,<6",
  "mcp>=2.3.0,<3",
  "langgraph>=1.2.20,<1.3",
]

[project.optional-dependencies]
models = ["openai>=3.46.0,<4", "anthropic>=2.6.0,<3", "google-genai>=3.0.0,<4", "ollama>=0.6.3,<0.7"]
production = ["asyncpg>=0.32.0,<0.33", "opentelemetry-exporter-otlp-proto-http>=1.45.2,<2"]

[project.scripts]
gym = "gym.cli:app"
maplewood = "agents.server:main"

[tool.hatch.build.targets.wheel]
packages = ["common", "agents", "gym"]

[dependency-groups]
dev = ["pytest>=9.2.0,<10", "pytest-asyncio>=1.4.1.post1,<2", "pytest-socket>=0.8.1,<0.9", "ruff>=0.17.4,<0.18", "nbstripout>=0.9.1,<0.10"]

[tool.pytest.ini_options]
testpaths = ["tests", "modules", "capstones"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --disable-socket --allow-unix-socket"
markers = ["docker: requires Docker services", "live: requires real models or external services"]
filterwarnings = ["error::DeprecationWarning:a2a.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["workspace", "docs/research", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
